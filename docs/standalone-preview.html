function servicesPage(){const total=services.reduce((s,x)=>s+x.volume,0),done=services.reduce((s,x)=>s+x.done,0);return `${commonHead('Pelayanan Publik','Volume, kecepatan penyelesaian, kepuasan dan isu layanan') }<div class="service-grid">${metricCard('Jumlah Layanan',total.toLocaleString('id-ID'),'6 kelompok layanan','blue','◎')}${metricCard('Permohonan Selesai',done.toLocaleString('id-ID'),`${Math.round(done/total*100)}% dari permohonan`,'green','✓')}${metricCard('Rata-rata Penyelesaian','2,7 hari','Lebih cepat 0,3 hari','green','◴')}${metricCard('Pengaduan Terbuka','87','12 membutuhkan tindak lanjut','amber','!')}</div><div class="two-col"><div class="card"><div class="card-title"><h3>Tren Volume Layanan</h3><span>Mar–Agu 2026</span></div><div class="chart">${[62,68,73,78,84,91].map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${v}%" data-tip="${['Mar','Apr','Mei','Jun','Jul','Agu'][i]}: ${v*820}"></div><span class="axis-label">${['Mar','Apr','Mei','Jun','Jul','Agu'][i]}</span></div>`).join('')}</div></div><div class="card"><div class="card-title"><h3>Kepuasan menurut Kategori</h3></div><div class="hbars">${services.map(x=>`<div class="hrow"><span>${x.name.split(' ')[0]}</span><div class="htrack"><div class="hfill" style="width:${x.satisfaction}%"></div></div><strong>${x.satisfaction}</strong></div>`).join('')}</div></div></div><div class="section-head"><div><h2>Layanan dengan Volume Tertinggi</h2></div></div><div class="table-wrap"><table><thead><tr><th>Layanan</th><th>Volume</th><th>Selesai</th><th>Rata-rata Waktu</th><th>Kepuasan</th><th>Status</th></tr></thead><tbody>${services.map(s=>`<tr><td><strong>${s.name}</strong></td><td>${s.volume.toLocaleString('id-ID')}</td><td>${s.done.toLocaleString('id-ID')}</td><td>${s.time} hari</td><td>${s.satisfaction}</td><td>${badge(s.satisfaction>=88?'Baik':s.satisfaction>=85?'Perlu Perhatian':'Kritis')}</td></tr>`).join('')}</tbody></table></div>`}
function analysisPage(){return `${commonHead('Analisis dan Rekomendasi','Temuan sistem untuk bahan pertimbangan pimpinan',`<select class="select"><option>Semua Bidang</option><option>Kesehatan</option><option>Infrastruktur</option><option>Ekonomi</option></select><select class="select"><option>Semua Urgensi</option><option>Kritis</option><option>Tinggi</option></select><button class="btn" data-action="reset">Reset</button>`)}<div class="insights"><div class="card insight"><div class="eyebrow">Analisis Sistem · Temuan Utama</div><h3>Perbaikan terjadi pada 8 dari 12 indikator strategis</h3><p>Perubahan paling kuat terlihat pada prevalensi stunting, IPM, dan cakupan air minum. Namun tiga indikator masih berada pada status kritis dan memerlukan perhatian lintas OPD.</p></div><div class="card insight"><div class="eyebrow">Wilayah Prioritas</div><h3>Mandau Talawang, Pasak Talawang, dan Kapuas Hulu</h3><p>Ketiga kecamatan berada pada kelompok skor komposit terendah. Fokus awal dapat diarahkan pada stunting, akses jalan, dan konsistensi pembaruan data wilayah.</p></div><div class="card insight"><div class="eyebrow">Indikator Membutuhkan Intervensi</div><h3>Stunting, jalan mantap, dan produksi padi</h3><p>Nilai telah bergerak membaik, tetapi belum memadai terhadap target 2026. Evaluasi program dan percepatan pelaksanaan disarankan sebelum triwulan IV.</p></div><div class="card insight"><div class="eyebrow">Peluang Perbaikan</div><h3>Percepatan pembaruan data meningkatkan ketepatan keputusan</h3><p>Dua sumber masih terlambat dan satu sinkronisasi perlu diulang. Menertibkan jadwal pembaruan akan mengurangi kebutuhan verifikasi manual.</p></div><div class="card insight" style="grid-column:1/-1;border-left-color:var(--gold)"><div class="eyebrow">Rekomendasi Prioritas</div><h3>Tindak lanjut 7 hari ke depan</h3><p>1) Prioritaskan verifikasi data Dinas Kesehatan dan DPUPRPKP. 2) Minta rencana percepatan dari Dinas Pertanian. 3) Fokuskan rapat wilayah pada tiga kecamatan berperingkat terendah. 4) Bandingkan realisasi program dengan target tahunan sebelum menetapkan intervensi tambahan.</p></div></div>`}
function alertsPage(){return `${commonHead('Pusat Peringatan','Daftar isu yang memerlukan tinjauan dan tindak lanjut',`<select class="select"><option>Semua Urgensi</option><option>Kritis</option><option>Tinggi</option><option>Sedang</option></select><select class="select"><option>Semua Status</option><option>Baru</option><option>Ditinjau</option><option>Selesai</option></select>`)}<div class="metrics">${metricCard('Kritis',alerts.filter(a=>a.urgency==='Kritis').length,'Memerlukan perhatian segera','red','!')}${metricCard('Tinggi',alerts.filter(a=>a.urgency==='Tinggi').length,'Prioritas tindak lanjut','amber','▲')}${metricCard('Sedang',alerts.filter(a=>a.urgency==='Sedang').length,'Perlu pemantauan','blue','●')}${metricCard('Selesai',alerts.filter(a=>a.status==='Selesai').length,'Telah ditindaklanjuti','green','✓')}</div><div class="section-head"><div><h2>Daftar Peringatan</h2></div></div>${alertsList(20)}`}
function sourcesPage(){return `${commonHead('Sumber Data','Status koneksi, jadwal pembaruan, dan sinkronisasi sumber',`<button class="btn" data-action="syncAll">↻ Sinkronkan Semua</button>`)}<div class="metrics">${metricCard('Sumber Aktif',sources.filter(x=>x.status==='Terhubung').length,'Dari 6 sumber terdaftar','green','⇄')}${metricCard('Dataset Terhubung',sources.reduce((s,x)=>s+x.datasets,0),'Dataset dari seluruh sumber','blue','▤')}${metricCard('Sinkronisasi Berhasil',5,'Dalam siklus terakhir','green','✓')}${metricCard('Sumber Bermasalah',1,'Perlu pemeriksaan koneksi','amber','!')}</div><div class="section-head"><div><h2>Daftar Sumber</h2></div></div><div class="table-wrap"><table><thead><tr><th>Nama Sumber</th><th>OPD Pemilik</th><th>Jenis</th><th>Jadwal</th><th>Sinkronisasi Terakhir</th><th>Dataset</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${sources.map(s=>`<tr><td><strong>${s.name}</strong></td><td>${s.owner}</td><td>${s.type}</td><td>${s.schedule}</td><td id="last-${s.id}">${s.last}</td><td>${s.datasets}</td><td>${badge(s.status)}</td><td><button class="btn sync-btn" data-sync="${s.id}">↻ Sinkronkan</button></td></tr>`).join('')}</tbody></table></div>`}
function validationPage(){return `${commonHead('Validasi Data','Antrean perubahan nilai yang perlu diperiksa sebelum digunakan') }<div class="metrics">${metricCard('Menunggu Validasi',validations.filter(v=>v.status==='Menunggu').length,'Antrean pemeriksaan aktif','amber','◴')}${metricCard('Sedang Diperiksa',validations.filter(v=>v.status==='Diperiksa').length,'Sedang dalam proses','blue','⌕')}${metricCard('Disetujui Hari Ini',7,'Tercatat pada sesi hari ini','green','✓')}${metricCard('Minta Perbaikan',2,'Dikembalikan ke pemilik data','red','↩')}</div><div class="section-head"><div><h2>Antrean Validasi</h2></div></div><div class="table-wrap"><table><thead><tr><th>Indikator</th><th>OPD</th><th>Sebelumnya</th><th>Terbaru</th><th>Perubahan</th><th>Sumber</th><th>Tanggal Masuk</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${validations.map(v=>`<tr><td><strong>${v.indicator}</strong></td><td>${v.opd}</td><td>${v.prev}</td><td>${v.latest}</td><td>${v.change}</td><td>${v.source}</td><td>${v.date}</td><td>${badge(v.status)}</td><td><button class="btn" data-detail="validation:${v.id}">Periksa</button></td></tr>`).join('')}</tbody></table></div>`}
function settingsPage(){return `${commonHead('Pengaturan','Preferensi tampilan untuk sesi presentasi') }<div class="card" style="max-width:760px"><div class="card-title"><h3>Preferensi Dashboard</h3></div><div class="indicator-row" style="padding:14px 0;border-bottom:1px solid var(--line)"><div><strong>Mode Presentasi</strong><div class="topbar-meta">Memperluas area konten dan menyederhanakan elemen administratif.</div></div><button class="btn" id="presentationBtn2">${state.presentation?'Nonaktifkan':'Aktifkan'}</button></div><div class="indicator-row" style="padding:14px 0;border-bottom:1px solid var(--line)"><div><strong>Tahun Aktif</strong><div class="topbar-meta">Periode utama dashboard.</div></div><select class="select" id="yearSelect2">${years.map(y=>`<option ${y===state.year?'selected':''}>${y}</option>`).join('')}</select></div><div class="indicator-row" style="padding:14px 0"><div><strong>Reset Pengaturan Tampilan</strong><div class="topbar-meta">Mengembalikan sidebar dan filter ke kondisi awal.</div></div><button class="btn" data-action="resetAll">Reset</button></div></div>`}
function pageContent(){const stateParam=new URLSearchParams(location.search).get('state');if(stateParam==='error')return `<div class="errorbox"><strong>Data belum dapat ditampilkan.</strong><p>Terjadi kendala saat memuat tampilan. Gunakan tombol muat ulang untuk mencoba kembali.</p><button class="btn" onclick="location.href=location.pathname">Muat Ulang</button></div>`;if(state.loading)return `<div class="loading-view">${Array(8).fill('<div class="skeleton"></div>').join('')}</div>`;return ({summary,map:mapPage,opd:opdPage,finance:financePage,services:servicesPage,analysis:analysisPage,alerts:alertsPage,sources:sourcesPage,validation:validationPage,settings:settingsPage}[state.page]||summary)()}
function drawer(){if(!state.drawer)return '';let [type,id]=state.drawer.split(':');let content='';if(type==='indicator'){const i=indicators.find(x=>x.id===id);content=`<h2>${i.name}</h2><p class="topbar-meta">${i.opd} · ${i.period}</p><div class="metrics" style="grid-template-columns:1fr 1fr;margin-top:18px">${metricCard('Nilai Terkini',`${fmt(i.value)} ${i.unit}`,'Pembaruan '+i.updated,'blue','▦')}${metricCard('Target',`${fmt(i.target)} ${i.unit}`,`${pct(i)}% capaian`,'green','◎')}</div><div class="card" style="margin-top:14px"><h3>Tren 2022–2026</h3><div class="chart" style="height:170px">${i.trend.map((v,k)=>`<div class="bar-col"><div class="bar" style="height:${v/Math.max(...i.trend)*90}%" data-tip="${v}"></div><span class="axis-label">${years[k]}</span></div>`).join('')}</div></div>`}else if(type==='opd'){const o=opds.find(x=>x.id===+id);content=`<h2>${o.name}</h2><p class="topbar-meta">Ringkasan capaian dan kualitas data</p><div class="metrics" style="grid-template-columns:1fr 1fr;margin-top:16px">${metricCard('Capaian',o.score+'%','Skor indikator strategis','green','✓')}${metricCard('Indikator',o.count,'Indikator terpantau','blue','▦')}</div><div class="card" style="margin-top:14px"><h3>Riwayat Status</h3><p>28 Agu · Pembaruan diterima</p><p>26 Agu · Validasi indikator selesai</p><p>22 Agu · Sinkronisasi sumber berhasil</p></div>`}else if(type==='alert'){const a=alerts.find(x=>x.id===+id);content=`<h2>${a.title}</h2><p>${badge(a.urgency)} ${badge(a.status)}</p><div class="card"><strong>${a.opd}</strong><p class="topbar-meta">Jenis: ${a.type} · ${a.time}</p><p>Peringatan ini masuk ke pusat pemantauan dan membutuhkan konfirmasi tindak lanjut.</p></div><div class="card" style="margin-top:12px"><h3>Timeline Tindak Lanjut</h3><p>07.14 WIB · Peringatan terdeteksi</p><p>07.19 WIB · Masuk antrean pimpinan</p></div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn soft" data-action="reviewAlert">Tandai Ditinjau</button><button class="btn" data-action="forwardAlert">Teruskan ke OPD</button><button class="btn primary" data-action="resolveAlert">Selesaikan</button></div>`}else if(type==='validation'){const v=validations.find(x=>x.id===+id);content=`<h2>Periksa ${v.indicator}</h2><p class="topbar-meta">${v.opd} · ${v.source}</p><div class="metrics" style="grid-template-columns:1fr 1fr;margin-top:16px">${metricCard('Nilai Sebelumnya',v.prev,'Periode sebelumnya','blue','←')}${metricCard('Nilai Terbaru',v.latest,`Perubahan ${v.change}`,'amber','→')}</div><div class="card" style="margin-top:14px"><h3>Catatan Validator</h3><textarea id="validatorNote" style="width:100%;min-height:100px;border:1px solid var(--line);border-radius:10px;padding:10px" placeholder="Tambahkan catatan pemeriksaan..."></textarea></div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary" data-action="approveValidation">Setujui</button><button class="btn" data-action="fixValidation">Minta Perbaikan</button><button class="btn danger" data-action="rejectValidation">Tolak</button></div>`}return `<div class="drawer-overlay open" id="drawerOverlay"><aside class="drawer" role="dialog" aria-modal="true"><div class="drawer-head"><strong>Detail</strong><button class="icon-btn" id="closeDrawer">×</button></div>${content}</aside></div>`}
function searchModal(){return `<div class="modal-overlay" id="searchModal"><div class="modal"><div class="drawer-head"><strong>Pencarian Dashboard</strong><button class="icon-btn" data-close-modal>×</button></div><input class="search" id="globalSearch" style="width:100%" autofocus placeholder="Cari indikator, OPD, kecamatan, atau menu"><div id="searchResults" style="margin-top:12px"><div class="empty">Ketik kata kunci untuk mencari seluruh dashboard.</div></div></div></div>`}
function render(){document.querySelector('#app').innerHTML=`<div class="app ${state.collapsed?'sidebar-collapsed':''} ${state.presentation?'presentation':''}">${sidebar()}<div class="mobile-overlay ${state.mobile?'open':''}" id="mobileOverlay"></div><main class="main">${header()}<div class="content">${pageContent()}</div></main>${drawer()}</div>`;bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.mobile=false;state.loading=true;history.replaceState({},'',location.pathname+'?page='+state.page);render();setTimeout(()=>{state.loading=false;render()},250)});document.querySelector('#collapseBtn')?.addEventListener('click',()=>{state.collapsed=!state.collapsed;render()});document.querySelector('#mobileMenu')?.addEventListener('click',()=>{state.mobile=true;render()});document.querySelector('#mobileOverlay')?.addEventListener('click',()=>{state.mobile=false;render()});document.querySelector('#yearSelect')?.addEventListener('change',e=>{state.year=+e.target.value;toast('Tahun tampilan diubah ke '+state.year);render()});document.querySelector('#yearSelect2')?.addEventListener('change',e=>{state.year=+e.target.value;render()});document.querySelectorAll('#presentationBtn,#presentationBtn2').forEach(b=>b.onclick=()=>{state.presentation=!state.presentation;state.collapsed=state.presentation;toast(state.presentation?'Mode Presentasi diaktifkan':'Mode Presentasi dinonaktifkan');render()});document.querySelector('#profile')?.addEventListener('click',e=>{if(e.target.closest('.profile-menu'))return;state.profile=!state.profile;render()});document.querySelector('#searchBtn')?.addEventListener('click',()=>{document.body.insertAdjacentHTML('beforeend',searchModal());bindSearch()});document.querySelector('#notifBtn')?.addEventListener('click',()=>{state.page='alerts';state.loading=false;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.chartTab=b.dataset.tab;render()});document.querySelectorAll('[data-district]').forEach(b=>b.onclick=()=>{state.district=b.dataset.district;render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{state.drawer=b.dataset.detail;render()});document.querySelector('#closeDrawer')?.addEventListener('click',()=>{state.drawer=null;render()});document.querySelector('#drawerOverlay')?.addEventListener('click',e=>{if(e.target.id==='drawerOverlay'){state.drawer=null;render()}});document.querySelector('#statusFilter')?.addEventListener('change',e=>{state.status=e.target.value;render()});document.querySelector('#opdSearch')?.addEventListener('input',e=>{state.search=e.target.value;setTimeout(render,80)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action));document.querySelectorAll('[data-sync]').forEach(b=>b.onclick=()=>syncOne(b));document.onkeydown=e=>{if(e.key==='Escape'){document.querySelector('.modal-overlay')?.remove();if(state.drawer){state.drawer=null;render()}if(state.mobile){state.mobile=false;render()}}}}
function bindSearch(){const m=document.querySelector('#searchModal');m.querySelector('[data-close-modal]').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};const input=m.querySelector('#globalSearch'),res=m.querySelector('#searchResults');input.oninput=()=>{const q=input.value.toLowerCase().trim();if(!q){res.innerHTML='<div class="empty">Ketik kata kunci untuk mencari seluruh dashboard.</div>';return}const found=[...indicators.map(i=>({name:i.name,meta:i.opd,go:()=>{m.remove();state.page='summary';state.drawer='indicator:'+i.id;state.loading=false;render()}})),...opds.map(o=>({name:o.name,meta:'OPD',go:()=>{m.remove();state.page='opd';state.drawer='opd:'+o.id;state.loading=false;render()}})),...districts.map(d=>({name:d.name,meta:'Kecamatan',go:()=>{m.remove();state.page='map';state.district=d.name;state.loading=false;render()}}))].filter(x=>x.name.toLowerCase().includes(q)).slice(0,8);res.innerHTML=found.length?found.map((x,i)=>`<button class="nav-item" style="color:var(--ink);background:#f6f8fa" data-result="${i}"><span class="nav-icon">⌕</span><span><strong>${x.name}</strong><br><small>${x.meta}</small></span></button>`).join(''):'<div class="empty">Tidak ada hasil yang cocok.</div>';res.querySelectorAll('[data-result]').forEach(b=>b.onclick=found[+b.dataset.result].go)}}
function handleAction(a){if(a==='report'||a==='export'){const text='SABABUKA BERSINAR\nRingkasan Eksekutif Kabupaten Kapuas\nPeriode Agustus 2026\n\nIndikator terpantau: '+indicators.length+'\nIndikator kritis: '+indicators.filter(i=>i.status==='critical').length+'\nPenyerapan anggaran: 58,7%';const blob=new Blob([text],{type:'text/plain'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=a==='report'?'laporan-eksekutif-sababuka.txt':'ringkasan-keuangan-sababuka.txt';link.click();URL.revokeObjectURL(url);toast('File ringkasan berhasil dibuat')}else if(a==='reset'){state.status='Semua';state.search='';toast('Filter direset');render()}else if(a==='resetAll'){state.collapsed=false;state.presentation=false;state.status='Semua';state.search='';toast('Pengaturan tampilan direset');render()}else if(a==='syncAll'){toast('Sinkronisasi semua sumber dimulai');setTimeout(()=>toast('Sinkronisasi selesai: 6 sumber diperbarui'),900)}else if(['reviewAlert','forwardAlert','resolveAlert'].includes(a)){toast(a==='reviewAlert'?'Peringatan ditandai sudah ditinjau':a==='forwardAlert'?'Peringatan diteruskan ke OPD':'Peringatan ditandai selesai');state.drawer=null;render()}else if(['approveValidation','fixValidation','rejectValidation'].includes(a)){toast(a==='approveValidation'?'Data disetujui':a==='fixValidation'?'Permintaan perbaikan dikirim':'Data ditolak');state.drawer=null;render()}else if(a==='metric'){toast('Rincian metrik tersedia pada halaman terkait')}else if(a==='help'){toast('Gunakan Mode Presentasi untuk tampilan proyektor yang lebih luas')}else if(a==='profile'){toast('Profil Bupati Kapuas aktif pada sesi ini')}}
function syncOne(btn){btn.classList.add('syncing');btn.textContent='↻ Memproses';setTimeout(()=>{btn.classList.remove('syncing');btn.textContent='↻ Sinkronkan';const id=btn.dataset.sync;document.querySelector('#last-'+id).textContent='28 Agu, 07.45';toast('Sinkronisasi sumber berhasil')},700)}
const qp=new URLSearchParams(location.search);if(qp.get('page')&&titleMap[qp.get('page')])state.page=qp.get('page');render();setTimeout(()=>{state.loading=false;render()},350);</script></body></html>
